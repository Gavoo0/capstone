name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Fase 2/Codigo/frontend/package-lock.json
            Fase 2/Codigo/backend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: Fase 2/Codigo/frontend
      - name: Check frontend style
        run: npm run lint
        working-directory: Fase 2/Codigo/frontend
      - name: Build frontend
        run: npm run build
        working-directory: Fase 2/Codigo/frontend
      - name: Install backend dependencies
        run: npm ci
        working-directory: Fase 2/Codigo/backend
      - name: Test backend rules
        run: npm test
        working-directory: Fase 2/Codigo/backend
      - name: Check backend JavaScript syntax
        shell: bash
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
        working-directory: Fase 2/Codigo/backend
