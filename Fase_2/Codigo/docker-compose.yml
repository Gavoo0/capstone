version: '3.8'
services:
  database:
    image: postgres:15-alpine
    container_name: futuro_postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin_futuro
      POSTGRES_PASSWORD: FuturoSecurePassword2026!
      POSTGRES_DB: escuela_futuro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - futuro_network
  pgadmin:
    image: dpage/pgadmin4
    container_name: futuro_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@futuro.cl
      PGADMIN_DEFAULT_PASSWORD: AdminPassword2026!
    ports:
      - "5050:80"
    depends_on:
      - database
    networks:
      - futuro_network
volumes:
  postgres_data:
networks:
  futuro_network:
    driver: bridge
