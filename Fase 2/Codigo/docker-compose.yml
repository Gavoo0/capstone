services:
  database:
    image: mysql:8.0
    container_name: futuro_mysql_db
    restart: unless-stopped
    command: --lower_case_table_names=1
    environment:
      # shortcut: root sin contraseña solo para desarrollo local; configura credenciales seguras al desplegar.
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: escuela_conductores
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
