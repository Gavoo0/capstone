<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--n:#0D0D0D;--a:#FFC400;--g:#4A4A4A;--f:#FAFAF8;--l:#FFF3C4;--b:#E3E3DD}
*{box-sizing:border-box}
body{margin:0;font-family:Roboto,Arial,sans-serif;background:var(--f);color:var(--n);font-size:14px}
header{background:var(--n);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:4px solid var(--a)}
header h1{font-size:18px;margin:0;font-weight:700}header h1 span{color:var(--a)}
header .u{margin-left:auto;font-size:12px;color:#bbb}
nav{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--b);padding:0 12px;overflow-x:auto}
nav button{border:0;background:none;padding:12px 14px;font-size:14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{border-bottom-color:var(--a);font-weight:700}
main{padding:16px 20px;max-width:1400px;margin:auto}
select,input,textarea{font:inherit;padding:7px 9px;border:1px solid #bbb;border-radius:6px;background:#fff;max-width:100%}
textarea{width:100%;min-height:64px}
button.b{background:var(--n);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600}
button.b.y{background:var(--a);color:var(--n)}button.b.c{background:#fff;color:var(--n);border:1px solid var(--n)}
button.b:disabled{opacity:.5;cursor:wait}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.kan{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:10px;overflow-x:auto}
.col{background:#fff;border:1px solid var(--b);border-radius:8px;min-height:300px}
.col h3{margin:0;padding:9px 10px;font-size:13px;background:var(--n);color:#fff;border-radius:8px 8px 0 0;display:flex;justify-content:space-between}
.col.drop{outline:3px dashed var(--a)}
.card{margin:8px;padding:9px;background:var(--l);border-left:4px solid var(--a);border-radius:6px;cursor:grab;font-size:13px}
.card .id{font-weight:700;font-size:12px}.card .m{color:var(--g);font-size:12px;margin-top:5px}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:var(--n);color:#fff;margin-right:4px}
.tag.y{background:var(--a);color:var(--n)}.tag.g{background:var(--g)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--b)}
th{background:var(--a);text-align:left;padding:8px;font-size:12px}td{padding:7px 8px;border-top:1px solid var(--b);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover{background:var(--l)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.box{background:#fff;border:1px solid var(--b);border-radius:8px;padding:14px}
.box h3{margin:0 0 8px;font-size:15px}
.prog{height:10px;background:var(--b);border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--a)}
.num{font-size:28px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9;padding:10px}
.modal.on{display:flex}.modal .in{background:#fff;border-radius:10px;padding:18px;width:560px;max-width:100%;max-height:92vh;overflow:auto}
.modal label{display:block;font-size:12px;margin:9px 0 3px;color:var(--g);font-weight:700}.modal input,.modal select{width:100%}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:10;max-width:90vw}
.toast.err{background:#7a1010}.toast.on{display:block}
.note{background:var(--l);border-left:4px solid var(--a);padding:8px 10px;border-radius:4px;font-size:12px;margin-bottom:12px}
svg text{font-family:inherit}
@media(max-width:700px){main{padding:10px}}
</style>
</head>
<body>
<header><h1>Tablero de sprints · <span>Escuela de Conductores Futuro</span></h1><span class="u" id="usuario"></span></header>
<nav id="nav"></nav>
<main id="vista"><p>Cargando…</p></main>
<div class="modal" id="modal"><div class="in" id="modalIn"></div></div>
<div class="toast" id="toast"></div>
<script>
var S = null, TAB = 'tablero', SPR = '', SEL_RESP = '', METRICA = 'tareas';
var TABS = [['tablero','Tablero'],['backlog','Backlog'],['sprints','Sprints'],['burndown','Burndown'],['daily','Daily'],['impedimentos','Impedimentos'],['github','GitHub'],['informes','Informes y retro']];

function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(id){return document.getElementById(id)}
function api(fn){
  var args=[].slice.call(arguments,1);
  return new Promise(function(ok,mal){
    google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){mal(e)})[fn].apply(google.script.run,args);
  });
}
function aviso(msg,error){var t=$('toast');t.textContent=msg;t.className='toast on'+(error?' err':'');clearTimeout(aviso.h);aviso.h=setTimeout(function(){t.className='toast'},error?6000:2500)}
function falla(e){aviso((e&&e.message)||String(e),true)}
function sprintActual(){return S.sprints.filter(function(s){return s.ID===SPR})[0]}
function cerrar(){$('modal').className='modal'}
function abrir(html){$('modalIn').innerHTML=html;$('modal').className='modal on'}

function recargar(){
  return api('getEstado').then(function(e){
    S=e;
    if(!SPR){var a=e.sprints.filter(function(s){return s.Estado==='Activo'})[0]||e.sprints[e.sprints.length-1];SPR=a?a.ID:''}
    $('usuario').textContent=e.usuario||'';
    pintar();
  }).catch(falla);
}
function pintar(){
  $('nav').innerHTML=TABS.map(function(t){return '<button class="'+(TAB===t[0]?'on':'')+'" onclick="irA(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
  var v={tablero:vTablero,backlog:vBacklog,sprints:vSprints,burndown:vBurndown,daily:vDaily,impedimentos:vImpedimentos,github:vGithub,informes:vInformes}[TAB];
  $('vista').innerHTML=v();
  if(TAB==='burndown')cargarBurndown();
}
function irA(t){TAB=t;pintar()}
function selSprint(extra){
  return '<select onchange="SPR=this.value;pintar()">'+S.sprints.map(function(s){return '<option value="'+esc(s.ID)+'"'+(s.ID===SPR?' selected':'')+'>'+esc(s.Nombre)+'</option>'}).join('')+'</select>';
}

/* ---------- Tablero ---------- */
function vTablero(){
  var s=sprintActual();if(!s)return '<p>No hay sprints. Crea uno en la pestaña Sprints.</p>';
  var gente=S.config.Integrantes;
  var tareas=S.tareas.filter(function(t){return t.Sprint===SPR&&(!SEL_RESP||t.Responsable===SEL_RESP)});
  var r=S.resumenes.filter(function(x){return x.sprint===SPR})[0].r;
  var h='<div class="bar">'+selSprint()+'<select onchange="SEL_RESP=this.value;pintar()"><option value="">Todos</option>'+gente.map(function(g){return '<option'+(SEL_RESP===g?' selected':'')+'>'+esc(g)+'</option>'}).join('')+'</select>'+
    '<button class="b y" onclick="editarTarea()">+ Nueva tarea</button><span><b>'+r.avance+'%</b> completado ('+r.completadas+' de '+r.total+') · '+esc(s.Inicio)+' → '+esc(s.Fin)+' · '+esc(s.Estado)+'</span></div>';
  if(s.Objetivo)h+='<div class="note"><b>Objetivo:</b> '+esc(s.Objetivo)+'</div>';
  h+='<div class="kan">'+S.estados.map(function(e){
    var ts=tareas.filter(function(t){return t.Estado===e});
    return '<div class="col" ondragover="event.preventDefault();this.classList.add(\'drop\')" ondragleave="this.classList.remove(\'drop\')" ondrop="soltar(event,\''+e+'\');this.classList.remove(\'drop\')"><h3>'+e+'<span>'+ts.length+'</span></h3>'+
      ts.map(function(t){return '<div class="card" draggable="true" ondragstart="event.dataTransfer.setData(\'text\',\''+esc(t.ID)+'\')" onclick="editarTarea(\''+esc(t.ID)+'\')"><span class="id">'+esc(t.ID)+'</span> <span class="tag y">'+esc(t.HU)+'</span>'+(t.SprintInicial&&t.SprintInicial!==t.Sprint?'<span class="tag g">viene de '+esc(t.SprintInicial)+'</span>':'')+'<div>'+esc(t.Titulo)+'</div><div class="m">'+esc(t.Responsable||'Sin asignar')+(t.FechaCierre?' · cerrada '+esc(t.FechaCierre):'')+'</div></div>'}).join('')+'</div>';
  }).join('')+'</div>';
  return h;
}
function soltar(ev,estado){
  var id=ev.dataTransfer.getData('text');if(!id)return;
  var t=S.tareas.filter(function(x){return x.ID===id})[0];if(!t||t.Estado===estado)return;
  t.Estado=estado;t.FechaCierre=estado==='Completado'?S.hoy:'';pintar();
  api('moverTarea',id,estado).then(function(){aviso(id+' → '+estado);return recargar()}).catch(function(e){falla(e);recargar()});
}
function opts(lista,sel,vacio){return (vacio?'<option value="">'+vacio+'</option>':'')+lista.map(function(x){var v=typeof x==='object'?x.v:x,l=typeof x==='object'?x.l:x;return '<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(l)+'</option>'}).join('')}
function editarTarea(id){
  var t=id?S.tareas.filter(function(x){return x.ID===id})[0]:{ID:'',Sprint:SPR,HU:'',Titulo:'',Area:'',Responsable:'',Estado:'Por hacer',HorasEst:'',FechaCierre:'',Evidencia:'',Origen:'Manual'};
  abrir('<h3>'+(id?'Tarea '+esc(id):'Nueva tarea')+'</h3>'+
   '<label>Título</label><input id="f_Titulo" value="'+esc(t.Titulo)+'">'+
   '<label>Sprint</label><select id="f_Sprint">'+opts(S.sprints.map(function(s){return{v:s.ID,l:s.Nombre}}),t.Sprint)+'</select>'+
   '<label>Historia de usuario</label><select id="f_HU">'+opts(S.historias.map(function(h){return{v:h.ID,l:h.ID+' · '+h.Titulo}}).concat(['QA','Soporte','Gestión']),t.HU,'—')+'</select>'+
   '<label>Responsable</label><select id="f_Responsable">'+opts(S.config.Integrantes.concat(['Por confirmar']),t.Responsable,'Sin asignar')+'</select>'+
   '<label>Área</label><input id="f_Area" value="'+esc(t.Area)+'">'+
   '<label>Estado</label><select id="f_Estado">'+opts(S.estados,t.Estado)+'</select>'+
   '<label>Horas estimadas</label><input id="f_HorasEst" type="number" min="0" value="'+esc(t.HorasEst)+'">'+
   '<label>Fecha de cierre (AAAA-MM-DD)</label><input id="f_FechaCierre" value="'+esc(t.FechaCierre)+'" placeholder="se completa sola al cerrar">'+
   '<label>Evidencia (commit, PR, captura)</label><textarea id="f_Evidencia">'+esc(t.Evidencia)+'</textarea>'+
   '<div class="bar" style="margin-top:12px"><button class="b y" onclick="guardarTarea(\''+esc(id||'')+'\')">Guardar</button><button class="b c" onclick="cerrar()">Cancelar</button>'+(id?'<button class="b c" style="margin-left:auto" onclick="borrar(\'Tareas\',\''+esc(id)+'\')">Eliminar</button>':'')+'</div>');
}
function leer(campos){var o={};campos.forEach(function(c){o[c]=$('f_'+c).value});return o}
function guardarTarea(id){
  var base=id?S.tareas.filter(function(x){return x.ID===id})[0]:{Origen:'Manual',SprintInicial:''};
  var o=Object.assign({},base,leer(['Titulo','Sprint','HU','Responsable','Area','Estado','HorasEst','FechaCierre','Evidencia']));
  api('guardarFila','Tareas',o).then(function(){cerrar();aviso('Guardado');return recargar()}).catch(falla);
}
function borrar(hoja,id){
  if(!confirm('¿Eliminar '+id+'? Esta acción no se puede deshacer.'))return;
  api('eliminarFila',hoja,id).then(function(){cerrar();aviso('Eliminado');return recargar()}).catch(falla);
}

/* ---------- Backlog ---------- */
function vBacklog(){
  var total=S.historias.reduce(function(a,h){return a+(Number(h.Horas)||0)},0);
  return '<div class="bar"><button class="b y" onclick="editarHU()">+ Nueva historia</button><span>'+S.historias.length+' historias · '+total+' h estimadas</span></div>'+
   '<div class="note">Las historias de usuario vienen del Product Backlog Priorizado de la Fase 1. Agrega aquí las demás historias del backlog ampliado.</div>'+
   '<table><tr><th>ID</th><th>Épica</th><th>Historia</th><th>Prioridad</th><th>Horas</th><th>Estado</th><th>Tareas</th></tr>'+
   S.historias.map(function(h){var n=S.tareas.filter(function(t){return t.HU===h.ID}).length;return '<tr class="click" onclick="editarHU(\''+esc(h.ID)+'\')"><td>'+esc(h.ID)+'</td><td>'+esc(h.Epica)+'</td><td>'+esc(h.Titulo)+'</td><td>'+esc(h.Prioridad)+'</td><td>'+esc(h.Horas)+'</td><td>'+esc(h.Estado)+'</td><td>'+n+'</td></tr>'}).join('')+'</table>';
}
function editarHU(id){
  var h=id?S.historias.filter(function(x){return x.ID===id})[0]:{ID:'',Epica:'',Titulo:'',Prioridad:'MEDIO',Horas:'',Estado:'Pendiente'};
  abrir('<h3>'+(id?esc(id):'Nueva historia de usuario')+'</h3><label>ID</label><input id="f_ID" value="'+esc(h.ID)+'" '+(id?'readonly':'placeholder="US-16"')+'>'+
   '<label>Épica</label><input id="f_Epica" value="'+esc(h.Epica)+'"><label>Historia</label><input id="f_Titulo" value="'+esc(h.Titulo)+'">'+
   '<label>Prioridad</label><select id="f_Prioridad">'+opts(['ALTA','MEDIO','BAJO'],h.Prioridad)+'</select>'+
   '<label>Horas</label><input id="f_Horas" type="number" min="0" value="'+esc(h.Horas)+'">'+
   '<label>Estado</label><select id="f_Estado">'+opts(['Pendiente','Por verificar','Implementada (por validar)','Validada'],h.Estado)+'</select>'+
   '<div class="bar" style="margin-top:12px"><button class="b y" onclick="guardarGenerico(\'Historias\',[\'ID\',\'Epica\',\'Titulo\',\'Prioridad\',\'Horas\',\'Estado\'])">Guardar</button><button class="b c" onclick="cerrar()">Cancelar</button></div>');
}
function guardarGenerico(hoja,campos,extra){
  var o=Object.assign({},extra||{},leer(campos));
  if(hoja==='Historias'&&!o.ID){falla({message:'Falta el ID.'});return}
  api('guardarFila',hoja,o).then(function(){cerrar();aviso('Guardado');return recargar()}).catch(falla);
}

/* ---------- Sprints ---------- */
function vSprints(){
  var max=Math.max.apply(null,S.velocidad.map(function(v){return v.comprometidas}).concat([1]));
  var h='<div class="bar"><button class="b y" onclick="editarSprint()">+ Nuevo sprint</button></div><div class="grid">'+
  S.sprints.map(function(s){var r=S.resumenes.filter(function(x){return x.sprint===s.ID})[0].r;
    return '<div class="box"><h3>'+esc(s.Nombre)+'</h3><div class="m"><span class="tag '+(s.Estado==='Activo'?'y':'')+'">'+esc(s.Estado)+'</span> '+esc(s.Inicio)+' → '+esc(s.Fin)+'</div>'+
    '<p style="color:#4A4A4A">'+esc(s.Objetivo)+'</p><div class="num">'+r.avance+'%</div><div class="prog"><i style="width:'+r.avance+'%"></i></div>'+
    '<p>'+r.completadas+' de '+r.total+' completadas · '+(r.porEstado.Arrastrada||0)+' arrastradas · '+r.commits+' commits</p>'+
    Object.keys(r.porPersona).map(function(p){return '<div style="font-size:12px">'+esc(p)+': '+r.porPersona[p].completadas+'/'+r.porPersona[p].total+'</div>'}).join('')+
    '<div class="bar" style="margin-top:8px"><button class="b c" onclick="SPR=\''+esc(s.ID)+'\';irA(\'tablero\')">Ver tablero</button><button class="b c" onclick="editarSprint(\''+esc(s.ID)+'\')">Editar</button></div>'+
    '<div style="font-size:11px;color:#4A4A4A">Datos: '+esc(s.Origen)+'</div></div>'}).join('')+'</div>'+
  '<div class="box" style="margin-top:14px"><h3>Velocidad (tareas comprometidas y completadas por sprint)</h3>'+
  S.velocidad.map(function(v){return '<div style="display:flex;gap:8px;align-items:center;margin:5px 0"><b style="width:34px">'+esc(v.sprint)+'</b><div style="flex:1"><div class="prog" style="height:12px;background:#ddd"><i style="width:'+(v.comprometidas*100/max)+'%;background:#888"></i></div><div class="prog" style="height:12px;margin-top:2px"><i style="width:'+(v.completadas*100/max)+'%"></i></div></div><span>'+v.completadas+'/'+v.comprometidas+'</span></div>'}).join('')+
  '<div style="font-size:11px">Barra gris: comprometidas · Barra amarilla: completadas en el sprint</div></div>';
  return h;
}
function editarSprint(id){
  var s=id?S.sprints.filter(function(x){return x.ID===id})[0]:{ID:'',Nombre:'',Objetivo:'',Inicio:'',Fin:'',Estado:'Planificado',Origen:'Manual'};
  abrir('<h3>'+(id?'Editar '+esc(id):'Nuevo sprint')+'</h3><label>ID (ej. S6)</label><input id="f_ID" value="'+esc(s.ID)+'" '+(id?'readonly':'')+'>'+
   '<label>Nombre</label><input id="f_Nombre" value="'+esc(s.Nombre)+'"><label>Objetivo</label><textarea id="f_Objetivo">'+esc(s.Objetivo)+'</textarea>'+
   '<label>Inicio (AAAA-MM-DD)</label><input id="f_Inicio" value="'+esc(s.Inicio)+'"><label>Fin (AAAA-MM-DD)</label><input id="f_Fin" value="'+esc(s.Fin)+'">'+
   '<label>Estado</label><select id="f_Estado">'+opts(['Planificado','Activo','Cerrado'],s.Estado)+'</select>'+
   '<div class="bar" style="margin-top:12px"><button class="b y" onclick="guardarSprint()">Guardar</button><button class="b c" onclick="cerrar()">Cancelar</button></div>');
}
function guardarSprint(){
  var o=leer(['ID','Nombre','Objetivo','Inicio','Fin','Estado']);o.Origen='Manual';
  var f=/^\d{4}-\d{2}-\d{2}$/;
  if(!o.ID||!f.test(o.Inicio)||!f.test(o.Fin)||o.Fin<o.Inicio){falla({message:'Revisa el ID y que las fechas sean AAAA-MM-DD con fin posterior al inicio.'});return}
  var previo=S.sprints.filter(function(s){return s.ID===o.ID})[0];if(previo)o.Origen=previo.Origen;
  api('guardarFila','Sprints',o).then(function(){cerrar();aviso('Guardado');return recargar()}).catch(falla);
}

/* ---------- Burndown ---------- */
function vBurndown(){
  return '<div class="bar">'+selSprint()+'<select onchange="METRICA=this.value;pintar()"><option value="tareas"'+(METRICA==='tareas'?' selected':'')+'>Por tareas</option><option value="horas"'+(METRICA==='horas'?' selected':'')+'>Por horas estimadas</option></select></div>'+
  '<div class="box"><div id="grafico">Calculando…</div><div id="notaBurn" class="note" style="margin-top:10px"></div></div>';
}
function cargarBurndown(){
  api('getBurndown',SPR,METRICA).then(function(b){
    var W=860,H=340,m={l:46,r:20,t:20,b:46},max=Math.max(b.total,1),n=b.puntos.length;
    var x=function(i){return m.l+(W-m.l-m.r)*(n>1?i/(n-1):0)},y=function(v){return m.t+(H-m.t-m.b)*(1-v/max)};
    var ideal=b.puntos.map(function(p,i){return x(i)+','+y(p.ideal)}).join(' ');
    var real=b.puntos.filter(function(p){return p.real!==null}).map(function(p){return x(b.puntos.indexOf(p))+','+y(p.real)}).join(' ');
    var g='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
    for(var k=0;k<=4;k++){var v=max*k/4;g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#E3E3DD"/><text x="'+(m.l-6)+'" y="'+(y(v)+4)+'" font-size="11" text-anchor="end">'+Math.round(v*10)/10+'</text>'}
    b.puntos.forEach(function(p,i){if(i%Math.ceil(n/14)===0)g+='<text x="'+x(i)+'" y="'+(H-m.b+16)+'" font-size="10" text-anchor="middle">'+p.fecha.slice(5)+'</text>'});
    g+='<polyline fill="none" stroke="#888" stroke-width="2" stroke-dasharray="6 4" points="'+ideal+'"/>';
    if(real)g+='<polyline fill="none" stroke="#0D0D0D" stroke-width="3" points="'+real+'"/>';
    b.puntos.forEach(function(p,i){if(p.real!==null)g+='<circle cx="'+x(i)+'" cy="'+y(p.real)+'" r="3.5" fill="#FFC400" stroke="#0D0D0D"/>'});
    g+='<text x="'+m.l+'" y="'+(H-6)+'" font-size="11">- - ideal · ━ real (pendiente al cierre de cada día)</text></svg>';
    $('grafico').innerHTML=b.total?g:'Este sprint no tiene tareas'+(METRICA==='horas'?' con horas estimadas.':'.');
    var s=sprintActual();
    $('notaBurn').innerHTML='<b>'+b.cerradas+' de '+b.tareas+'</b> tareas completadas dentro del sprint. '+(S.tareas.some(function(t){return t.Sprint===SPR&&(t.Origen==='Git'||t.Origen==='Inferido')})?'Algunas fechas de cierre se reconstruyeron desde Git (origen «Git» o «Inferido»); revísalas con el equipo.':'')+(METRICA==='horas'?' Solo cuentan tareas con horas estimadas.':'');
  }).catch(function(e){$('grafico').textContent='No se pudo calcular: '+((e&&e.message)||e)});
}

/* ---------- Daily ---------- */
function vDaily(){
  var l=S.daily.filter(function(d){return d.Sprint===SPR}).sort(function(a,b){return a.Fecha<b.Fecha?1:-1});
  return '<div class="bar">'+selSprint()+'<button class="b y" onclick="editarDaily()">+ Registrar daily</button></div>'+
   '<div class="note">Registra aquí cada daily de ahora en adelante. No se cargaron dailies pasadas porque no hay evidencia de ellas.</div>'+
   (l.length?'<table><tr><th>Fecha</th><th>Persona</th><th>Ayer</th><th>Hoy</th><th>Impedimentos</th></tr>'+l.map(function(d){return '<tr class="click" onclick="editarDaily(\''+esc(d.ID)+'\')"><td>'+esc(d.Fecha)+'</td><td>'+esc(d.Persona)+'</td><td>'+esc(d.Ayer)+'</td><td>'+esc(d.Hoy)+'</td><td>'+esc(d.Impedimentos)+'</td></tr>'}).join('')+'</table>':'<p>Sin registros en este sprint.</p>');
}
function editarDaily(id){
  var d=id?S.daily.filter(function(x){return x.ID===id})[0]:{ID:'',Fecha:S.hoy,Sprint:SPR,Persona:'',Ayer:'',Hoy:'',Impedimentos:''};
  abrir('<h3>Daily</h3><label>Fecha</label><input id="f_Fecha" value="'+esc(d.Fecha)+'"><label>Persona</label><select id="f_Persona">'+opts(S.config.Integrantes,d.Persona)+'</select>'+
   '<label>¿Qué hice ayer?</label><textarea id="f_Ayer">'+esc(d.Ayer)+'</textarea><label>¿Qué haré hoy?</label><textarea id="f_Hoy">'+esc(d.Hoy)+'</textarea>'+
   '<label>Impedimentos</label><textarea id="f_Impedimentos">'+esc(d.Impedimentos)+'</textarea>'+
   '<div class="bar" style="margin-top:12px"><button class="b y" onclick="guardarGenerico(\'Daily\',[\'Fecha\',\'Persona\',\'Ayer\',\'Hoy\',\'Impedimentos\'],{ID:\''+esc(id||'')+'\',Sprint:\''+esc(d.Sprint)+'\'})">Guardar</button><button class="b c" onclick="cerrar()">Cancelar</button>'+(id?'<button class="b c" style="margin-left:auto" onclick="borrar(\'Daily\',\''+esc(id)+'\')">Eliminar</button>':'')+'</div>');
}

/* ---------- Impedimentos ---------- */
function vImpedimentos(){
  var abiertos=S.impedimentos.filter(function(i){return i.Estado!=='Resuelto'}).length;
  return '<div class="bar"><button class="b y" onclick="editarImp()">+ Nuevo impedimento</button><span>'+S.impedimentos.length+' registrados · <b>'+abiertos+'</b> pendientes · '+(S.impedimentos.length-abiertos)+' resueltos</span></div>'+
   '<table><tr><th>ID</th><th>Detectado</th><th>Sprint</th><th>Descripción</th><th>Prioridad</th><th>Responsable</th><th>Estado</th><th>Acción</th><th>Cierre</th></tr>'+
   S.impedimentos.map(function(i){return '<tr class="click" onclick="editarImp(\''+esc(i.ID)+'\')"><td>'+esc(i.ID)+'</td><td>'+esc(i.Fecha)+'</td><td>'+esc(i.Sprint)+'</td><td>'+esc(i.Descripcion)+'</td><td>'+esc(i.Prioridad)+'</td><td>'+esc(i.Responsable)+'</td><td><span class="tag '+(i.Estado==='Resuelto'?'g':'y')+'">'+esc(i.Estado)+'</span></td><td>'+esc(i.Accion)+'</td><td>'+esc(i.FechaCierre)+'</td></tr>'}).join('')+'</table>';
}
function editarImp(id){
  var i=id?S.impedimentos.filter(function(x){return x.ID===id})[0]:{ID:'',Fecha:S.hoy,Sprint:SPR,Descripcion:'',Impacto:'',Prioridad:'Media',Responsable:'',Estado:'Abierto',Accion:'',FechaCierre:'',Evidencia:''};
  abrir('<h3>'+(id?esc(id):'Nuevo impedimento')+'</h3><label>Fecha detectado</label><input id="f_Fecha" value="'+esc(i.Fecha)+'"><label>Sprint</label><select id="f_Sprint">'+opts(S.sprints.map(function(s){return{v:s.ID,l:s.Nombre}}),i.Sprint)+'</select>'+
   '<label>Descripción</label><textarea id="f_Descripcion">'+esc(i.Descripcion)+'</textarea><label>Impacto en el sprint</label><input id="f_Impacto" value="'+esc(i.Impacto)+'">'+
   '<label>Prioridad</label><select id="f_Prioridad">'+opts(['Alta','Media','Baja'],i.Prioridad)+'</select><label>Responsable</label><select id="f_Responsable">'+opts(S.config.Integrantes.concat(['Por confirmar']),i.Responsable,'Sin asignar')+'</select>'+
   '<label>Estado</label><select id="f_Estado">'+opts(['Abierto','En gestión','Resuelto'],i.Estado)+'</select><label>Acción / mitigación</label><textarea id="f_Accion">'+esc(i.Accion)+'</textarea>'+
   '<label>Fecha de cierre</label><input id="f_FechaCierre" value="'+esc(i.FechaCierre)+'"><label>Evidencia</label><input id="f_Evidencia" value="'+esc(i.Evidencia)+'">'+
   '<div class="bar" style="margin-top:12px"><button class="b y" onclick="guardarGenerico(\'Impedimentos\',[\'Fecha\',\'Sprint\',\'Descripcion\',\'Impacto\',\'Prioridad\',\'Responsable\',\'Estado\',\'Accion\',\'FechaCierre\',\'Evidencia\'],{ID:\''+esc(id||'')+'\'})">Guardar</button><button class="b c" onclick="cerrar()">Cancelar</button>'+(id?'<button class="b c" style="margin-left:auto" onclick="borrar(\'Impedimentos\',\''+esc(id)+'\')">Eliminar</button>':'')+'</div>');
}

/* ---------- GitHub ---------- */
function vGithub(){
  var l=S.commits.filter(function(c){return !SEL_RESP||c.Autor===SEL_RESP});
  return '<div class="bar"><button class="b y" id="btnSync" onclick="sync()">Sincronizar con GitHub</button><span>Repositorio: <b>'+esc(S.config.GitHubRepo)+'</b> · rama(s): '+esc(S.config.GitHubRama)+' · '+S.commits.length+' commits guardados</span></div>'+
   '<div class="note">Para enlazar un commit a una tarea, incluye su ID en el mensaje (por ejemplo <b>S5-09: aplicar migración</b>) o elígela aquí. Para ramas sin fusionar, agrega su nombre en Config > GitHubRama separado por comas.</div>'+
   '<table><tr><th>Fecha</th><th>Autor</th><th>Mensaje</th><th>Sprint</th><th>Tarea</th></tr>'+l.map(function(c){
    return '<tr><td>'+esc(c.Fecha)+'</td><td>'+esc(c.Autor)+'</td><td><a href="'+esc(c.Url)+'" target="_blank" rel="noopener">'+esc(c.SHA)+'</a> '+esc(c.Mensaje)+'</td><td>'+esc(c.Sprint)+'</td><td><select onchange="vincular(\''+esc(c.SHA)+'\',this.value)">'+opts(S.tareas.map(function(t){return{v:t.ID,l:t.ID+' · '+t.Titulo.slice(0,40)}}),c.Tarea,'—')+'</select></td></tr>'}).join('')+'</table>';
}
function sync(){
  var b=$('btnSync');b.disabled=true;b.textContent='Sincronizando…';
  api('sincronizarGitHub').then(function(r){aviso(r.total+' commits leídos, '+r.nuevos+' nuevos');return recargar()}).catch(function(e){falla(e);pintar()});
}
function vincular(sha,t){api('vincularCommit',sha,t).then(function(){aviso('Enlazado')}).catch(falla)}

/* ---------- Informes y retro ---------- */
function vInformes(){
  var notas=S.notas.filter(function(n){return n.Sprint===SPR});
  var tipos=[['Bien','Retro · Salió bien'],['Mal','Retro · Salió mal'],['Mejorar','Retro · Qué mejoramos'],['Review','Review · Comentario'],['Release','Release · Nota']];
  return '<div class="bar">'+selSprint()+'</div><div class="grid">'+
   '<div class="box"><h3>Generar Google Doc del sprint</h3><p style="color:#4A4A4A">Crea un documento en Drive (carpeta «Futuro - Informes de Sprint») con los datos actuales.</p>'+
   [['planning','Sprint Planning'],['review','Sprint Review'],['retrospective','Retrospective'],['release','Release'],['impedimentos','Impedimentos']].map(function(t){return '<button class="b c" style="margin:3px" onclick="informe(\''+t[0]+'\',this)">'+t[1]+'</button>'}).join('')+'<div id="enlaces"></div></div>'+
   '<div class="box"><h3>Notas de retrospectiva, review y release</h3><div class="bar"><select id="n_tipo">'+opts(tipos.map(function(t){return{v:t[0],l:t[1]}}))+'</select></div><textarea id="n_texto" placeholder="Escribe la nota"></textarea><div class="bar" style="margin-top:6px"><select id="n_autor">'+opts(S.config.Integrantes,'','Equipo')+'</select><button class="b y" onclick="nuevaNota()">Agregar</button></div>'+
   (notas.length?'<ul>'+notas.map(function(n){return '<li><b>'+esc(n.Tipo)+':</b> '+esc(n.Texto)+(n.Autor?' <i>('+esc(n.Autor)+')</i>':'')+' <a href="#" onclick="borrar(\'Notas\',\''+esc(n.ID)+'\');return false">×</a></li>'}).join('')+'</ul>':'<p>Sin notas en este sprint.</p>')+'</div></div>';
}
function nuevaNota(){
  var t=$('n_texto').value.trim();if(!t){falla({message:'Escribe la nota.'});return}
  api('guardarFila','Notas',{ID:'',Sprint:SPR,Tipo:$('n_tipo').value,Texto:t,Autor:$('n_autor').value}).then(function(){aviso('Nota agregada');return recargar()}).catch(falla);
}
function informe(tipo,btn){
  btn.disabled=true;
  api('generarInforme',SPR,tipo).then(function(url){btn.disabled=false;$('enlaces').innerHTML+='<div><a href="'+esc(url)+'" target="_blank" rel="noopener">Abrir '+esc(tipo)+' de '+esc(SPR)+'</a></div>';aviso('Documento creado')}).catch(function(e){btn.disabled=false;falla(e)});
}

$('modal').addEventListener('click',function(e){if(e.target===$('modal'))cerrar()});
recargar();
</script>
</body>
</html>
